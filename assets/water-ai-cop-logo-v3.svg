<svg width="480" height="480" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg">
  <!-- solid navy circle -->
  <circle cx="240" cy="240" r="220" fill="#0A2E4D"/>

  <!-- white water droplet -->
  <path d="M240 100
           C240 100 155 220 155 288
           C155 340.4 192.4 380 240 380
           C287.6 380 325 340.4 325 288
           C325 220 240 100 240 100 Z"
        fill="#FFFFFF"/>

  <!-- navy neural network: 2 - 3 - 2 -->
  <g stroke="#0A2E4D" stroke-width="4" stroke-linecap="round">
    <!-- input (2) to hidden (3) -->
    <line x1="185" y1="248" x2="240" y2="228"/>
    <line x1="185" y1="248" x2="240" y2="270"/>
    <line x1="185" y1="248" x2="240" y2="312"/>
    <line x1="185" y1="296" x2="240" y2="228"/>
    <line x1="185" y1="296" x2="240" y2="270"/>
    <line x1="185" y1="296" x2="240" y2="312"/>
    <!-- hidden (3) to output (2) -->
    <line x1="240" y1="228" x2="295" y2="248"/>
    <line x1="240" y1="228" x2="295" y2="296"/>
    <line x1="240" y1="270" x2="295" y2="248"/>
    <line x1="240" y1="270" x2="295" y2="296"/>
    <line x1="240" y1="312" x2="295" y2="248"/>
    <line x1="240" y1="312" x2="295" y2="296"/>
  </g>
  <g fill="#0A2E4D">
    <circle cx="185" cy="248" r="9"/>
    <circle cx="185" cy="296" r="9"/>
    <circle cx="240" cy="228" r="9"/>
    <circle cx="240" cy="270" r="9"/>
    <circle cx="240" cy="312" r="9"/>
    <circle cx="295" cy="248" r="9"/>
    <circle cx="295" cy="296" r="9"/>
  </g>
</svg>
